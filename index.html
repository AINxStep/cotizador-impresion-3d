<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotizador de Impresión 3D</title>
  <meta name="description" content="Calcula el precio de un proyecto de impresión 3D con todos los costos: material, tiempo de máquina, electricidad, mano de obra, fallas, margen, comisiones e IVA.">
  <meta name="color-scheme" content="light dark">
  <script>
    // Tema antes del primer pintado: evita el destello con el tema equivocado.
    try {
      var t = localStorage.getItem('cot3d.theme.v1') || 'auto';
      document.documentElement.setAttribute('data-theme',
        t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
      var p = localStorage.getItem('cot3d.palette.v1');
      if (p) document.documentElement.setAttribute('data-palette', p);
    } catch (e) { /* sin localStorage: queda el tema claro por defecto */ }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 9.5 16 16 4 9.5z' fill='%23b26a1b'/%3E%3Cpath d='M4 14.2 16 20.7 28 14.2' fill='none' stroke='%23b26a1b' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3Cpath d='M4 19.4 16 25.9 28 19.4' fill='none' stroke='%23b26a1b' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round' opacity='.55'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="sheet" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Este cotizador necesita JavaScript para funcionar.</p></noscript>

  <script src="js/defaults.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/importers.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
